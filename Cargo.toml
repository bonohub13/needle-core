[package]
name = "needle-core"
version = "0.2.2"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
chrono = "0.4"
dialog = "0.3"
directories = "6.0"
font-loader = "0.11"
glm = "0.3.0"
glyphon = "0.12"
imgui = "0.12"
# imgui-wgpu = "0.28"
imgui-wgpu = { git = "https://github.com/Yatekii/imgui-wgpu-rs" }
imgui-winit-support = "0.13"
pollster = "1.0.1"
serde = {version = "1.0.215", features = ["derive"]}
thiserror = "2.0.12"
toml = "1.1"
wgpu = "30"
winit = { version = "0.30" }

[target.'cfg(windows)'.dependencies]
win-msgbox = "0.2.1"

[profile.release]
strip = "debuginfo"
lto = "fat"
